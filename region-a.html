<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A - Filters and Statistics</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/region-a.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js" defer></script>
  <script src="js/data-loader.js" defer></script>
  <script src="js/region-a.js" defer></script>
</head>
<body>
  <main class="region-a-container">
    <section class="filters-bar" aria-label="Dashboard filters">
      <label>
        <span>District</span>
        <select id="districtFilter">
          <option value="all">All Districts</option>
        </select>
      </label>

      <label>
        <span>Merchant Type</span>
        <select id="chainFilter">
          <option value="all">All Types</option>
          <option value="chain">Chain / Branded</option>
          <option value="independent">Independent</option>
        </select>
      </label>

      <label>
        <span>Octopus</span>
        <select id="octopusFilter">
          <option value="all">All Statuses</option>
          <option value="Y">Marked Supported</option>
          <option value="N">Not Marked Supported</option>
        </select>
      </label>

      <label>
        <span>Minimum Rating</span>
        <input type="number" id="ratingMin" min="0" max="5" step="0.5" value="0">
      </label>

      <button id="resetBtn" type="button">Reset</button>
    </section>

    <section class="stats-row" aria-label="Summary metrics">
      <article class="stat-card">
        <span id="totalCount">0</span>
        <label>Total Merchants</label>
      </article>
      <article class="stat-card">
        <span id="octopusRate">0%</span>
        <label>Octopus Share</label>
      </article>
      <article class="stat-card">
        <span id="avgRating">-</span>
        <label>Average Rating</label>
      </article>
      <article class="stat-card">
        <span id="chainCount">0</span>
        <label>Chain / Branded</label>
      </article>
    </section>

    <section class="chart-section">
      <div class="section-heading">
        <h2>District Distribution</h2>
        <span id="chartSubtitle">Sorted by merchant count</span>
      </div>
      <div id="districtChart" class="district-chart" role="img" aria-label="District merchant count chart"></div>
    </section>
  </main>
</body>
</html>
